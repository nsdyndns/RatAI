<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RatAI — Rage Against the AI</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(15, 23, 42, 0.7);
      --border: rgba(56, 189, 248, 0.2);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --cyan: #00F0FF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    /* Header Nav */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .nav-btn.active, .nav-btn:hover {
      color: var(--cyan);
      border-color: var(--cyan);
      background: rgba(0, 240, 255, 0.05);
    }

    .lang-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--cyan);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    /* Brand Hero */
    .brand-hero {
      text-align: center;
      margin-bottom: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-box {
      width: 160px;
      height: 160px;
      margin-bottom: 1rem;
    }

    .brand-title {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 0.2rem;
    }

    .brand-subtitle {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--cyan);
      text-transform: uppercase;
      line-height: 1.3;
      white-space: pre-line;
      margin-top: 0.5rem;
    }

    /* Content Card */
    .content-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h2 {
      font-size: 1.6rem;
      color: #ffffff;
      margin-bottom: 1.5rem;
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.5rem;
    }

    p {
      color: var(--text-main);
      margin-bottom: 1.2rem;
      font-size: 1.05rem;
    }
  </style>
  <!-- Matomo -->
<script>
  var _paq = window._paq = window._paq || [];
  /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
  _paq.push(['trackPageView']);
  _paq.push(['enableLinkTracking']);
  (function() {
    var u="https://ratai.matomo.cloud/";
    _paq.push(['setTrackerUrl', u+'matomo.php']);
    _paq.push(['setSiteId', '1']);
    var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
    g.async=true; g.src='https://cdn.matomo.cloud/ratai.matomo.cloud/matomo.js'; s.parentNode.insertBefore(g,s);
  })();
</script>
<!-- End Matomo Code -->
</head>
<body>

  <div class="container">
    <!-- Header Nav -->
    <header>
      <div class="nav-left">
        <button class="nav-btn active" id="btn-manifesto">Manifesto</button>
      </div>
      <button class="lang-toggle" id="lang-btn" onclick="toggleLanguage()">RU</button>
    </header>

    <!-- Brand Hero -->
    <div class="brand-hero">
      <div class="logo-box">
        <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; overflow: visible;" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="1.5" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

            <style>
              @keyframes syncGaze {
                0%, 100% { transform: translateX(-2.5px); }
                50% { transform: translateX(2.5px); }
              }

              @keyframes pupilGlow {
                0%, 100% { filter: drop-shadow(0 0 2px #00F0FF); }
                50% { filter: drop-shadow(0 0 6px #00F0FF); }
              }

              .animated-sync {
                animation: syncGaze 4s ease-in-out infinite;
                transform-origin: center;
              }

              .animated-pupil {
                animation: syncGaze 4s ease-in-out infinite, pupilGlow 2s ease-in-out infinite;
                transform-origin: center;
              }
            </style>
          </defs>

          <!-- Natural Rat Low-Poly Ears -->
          <g fill="none" stroke="#00F0FF" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="38,28 14,14 10,28 26,38" stroke-width="1.6" opacity="0.85" fill="rgba(0, 240, 255, 0.03)"></polygon>
            <polygon points="38,28 22,22 26,38" stroke-width="1.1" opacity="0.5"></polygon>
            
            <polygon points="62,28 86,14 90,28 74,38" stroke-width="1.6" opacity="0.85" fill="rgba(0, 240, 255, 0.03)"></polygon>
            <polygon points="62,28 78,22 74,38" stroke-width="1.1" opacity="0.5"></polygon>
          </g>

          <!-- Head Low-Poly Polygon Wireframe (Cyan) -->
          <polygon points="50,18 26,38 28,78 50,92 72,78 74,38" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"></polygon>
          <polygon points="26,38 38,45 50,18 62,45 74,38" fill="none" stroke="#00F0FF" stroke-width="1.2" opacity="0.5"></polygon>
          <polygon points="38,45 28,78 50,68 72,78 62,45" fill="none" stroke="#00F0FF" stroke-width="1.2" opacity="0.5"></polygon>
          <polygon points="50,68 50,92" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.7"></polygon>

          <!-- Static Eyes Group with Moving Pupils -->
          <g>
            <polygon points="32,46 44,44 40,52 30,50" fill="#090d16" stroke="#00F0FF" stroke-width="1.2" opacity="0.95"></polygon>
            <g class="animated-pupil">
              <circle cx="36" cy="48" r="2.5" fill="#00F0FF" filter="url(#cyanGlow)"></circle>
              <circle cx="37" cy="47" r="0.8" fill="#FFFFFF"></circle>
            </g>

            <polygon points="68,46 56,44 60,52 70,50" fill="#090d16" stroke="#00F0FF" stroke-width="1.2" opacity="0.95"></polygon>
            <g class="animated-pupil">
              <circle cx="64" cy="48" r="2.5" fill="#00F0FF" filter="url(#cyanGlow)"></circle>
              <circle cx="65" cy="47" r="0.8" fill="#FFFFFF"></circle>
            </g>
          </g>

          <!-- Synchronized Nose & Whiskers Group -->
          <g class="animated-sync">
            <g filter="url(#cyanGlow)">
              <polygon points="50,62 45,68 50,74 55,68" fill="#090d16" stroke="#00F0FF" stroke-width="1.4"></polygon>
              <circle cx="47.5" cy="68" r="0.8" fill="#00F0FF"></circle>
              <circle cx="52.5" cy="68" r="0.8" fill="#00F0FF"></circle>
            </g>

            <!-- Left Whiskers -->
            <line x1="41" y1="65" x2="14" y2="59" stroke="#00F0FF" stroke-width="1" stroke-dasharray="2 2" opacity="0.8"></line>
            <line x1="39" y1="68" x2="13" y2="68" stroke="#00F0FF" stroke-width="1" stroke-dasharray="2 2" opacity="0.85"></line>
            <line x1="41" y1="71" x2="14" y2="77" stroke="#00F0FF" stroke-width="1" stroke-dasharray="2 2" opacity="0.8"></line>
            
            <!-- Right Whiskers -->
            <line x1="59" y1="65" x2="86" y2="59" stroke="#00F0FF" stroke-width="1" stroke-dasharray="2 2" opacity="0.8"></line>
            <line x1="61" y1="68" x2="87" y2="68" stroke="#00F0FF" stroke-width="1" stroke-dasharray="2 2" opacity="0.85"></line>
            <line x1="59" y1="71" x2="86" y2="77" stroke="#00F0FF" stroke-width="1" stroke-dasharray="2 2" opacity="0.8"></line>
          </g>
        </svg>
      </div>

      <h1 class="brand-title">RatAI</h1>
      <div class="brand-subtitle">RAGE
AGAINST
THE AI</div>
    </div>

    <!-- Main Content Area -->
    <main class="content-card" id="content-block">
      <!-- Dynamically rendered -->
    </main>
  </div>

  <script>
    let currentLang = 'EN';

    const contentData = {
      EN: {
        title: "Official Manifesto & Mission Statement",
        p1: "We are a group of enthusiasts striving to make the Internet, social platforms, games, and gaming communities a safer place for users. Our primary focus is placed on protecting children and teenagers from the negative impact of harmful content on their impressionable minds. A dedicated cornerstone of our activity is aimed at identifying and preventing the exploitation of artificial intelligence (AI) technologies for these harmful purposes.",
        p2: "To achieve these objectives, we are working to expand our collaboration with legislative bodies and political parties, as well as increasing our operational staff to provide consulting services and conduct investigative journalism.",
        p3: "Currently, we operate as a small team of like-minded volunteers. As our group expands and/or as we establish a charitable direction to support our initiatives, we will do everything in our power to transition our humble beginning into the hands of professionals.",
        p4: "We will establish a clear roadmap for our sub-projects and set up transparent reporting alongside appropriate documentation. We are strong advocates of complete transparency when it comes to charity and donations.",
        p5: "Thank you for your attention to this matter."
      },
      RU: {
        title: "Официальный манифест и миссия организации",
        p1: "Мы группа энтузиастов, которые стремятся сделать интернет, социальные платформы, игры и игровые сообщества более безопасным местом для пользователей. Особый фокус делаем на детях и влиянии негативной информации на их неокрепшие умы. Отдельный фокус нашей деятельности направлен на выявление и пресечение фактов эксплуатации технологий искусственного интеллекта (AI) в этих целях.",
        p2: "Мы пытаемся расширить наше сотрудничество с законодательными органами, политическими партиями, увеличить штат для проведения консалтинговых услуг и журналистских расследований.",
        p3: "Пока мы имеем небольшую группу энтузиастов-единомышленников, которые действуют на волонтерских началах. По мере расширения нашей группы и/или создания благотворительного направления по поддержке наших начинаний, мы сделаем все от нас возможное, чтоб передать наше скромное начинание в руки профессионалов.",
        p4: "Создадим roadmap наших подпроектов. Настроим отчетность и предъявление соответствующей документации. Мы сторонники полной прозрачности, когда это касается благотворительности и донатов.",
        p5: "Спасибо за внимание к этому вопросу."
      }
    };

    function renderContent() {
      const data = contentData[currentLang];
      const container = document.getElementById('content-block');
      
      container.innerHTML = `
        <h2>${data.title}</h2>
        <p>${data.p1}</p>
        <p>${data.p2}</p>
        <p>${data.p3}</p>
        <p>${data.p4}</p>
        <p>${data.p5}</p>
      `;

      document.getElementById('lang-btn').textContent = currentLang === 'EN' ? 'RU' : 'EN';
    }

    function toggleLanguage() {
      currentLang = currentLang === 'EN' ? 'RU' : 'EN';
      renderContent();
    }

    renderContent();
  </script>

</html>
